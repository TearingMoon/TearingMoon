<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleBarBg" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EDEDED"/>
      <stop offset="100%" stop-color="#D8D8D8"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title {
        font-family: "Consolas", "Courier New", monospace;
        font-size: 18px;
        fill: #1A1A1A;
      }

      .terminalText {
        font-family: "Consolas", "Courier New", monospace;
        font-size: 34px;
        fill: #F2F2F2;
      }

      .promptText {
        font-family: "Consolas", "Courier New", monospace;
        font-size: 34px;
        fill: #F2F2F2;
      }

      .cursor {
        animation: blink 1s steps(1, end) infinite;
      }
    </style>
  </defs>

  <rect x="10" y="10" width="1180" height="400" rx="10" fill="#000000" stroke="#BFBFBF" stroke-width="2"/>

  <rect x="10" y="10" width="1180" height="42" rx="10" fill="url(#titleBarBg)"/>
  <rect x="10" y="42" width="1180" height="10" fill="url(#titleBarBg)"/>

  <text x="600" y="36" text-anchor="middle" class="title">C:\Users\David\README.cmd</text>

  <text x="48" y="115" class="terminalText">Microsoft Windows [Version 10.0.22631.0]</text>
  <text x="48" y="150" class="terminalText">(c) Microsoft Corporation. All rights reserved.</text>

  <text x="48" y="220" class="promptText">C:\Users\David&gt; whoami</text>
  <text x="48" y="285" class="promptText" filter="url(#softGlow)">David Torrubia</text>

  <text x="48" y="350" class="promptText">C:\Users\David&gt; <tspan class="cursor">_</tspan></text>

  <style>
    @keyframes blink {
      0%, 50% { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }
  </style>
</svg>